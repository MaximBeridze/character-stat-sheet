<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Tracker</title>
  <style>
    :root {
      --bg: #101417;
      --panel: #182024;
      --panel-2: #202a2f;
      --text: #f4f7f5;
      --muted: #a9b7b3;
      --accent: #50c878;
      --accent-2: #f3b34c;
      --health: #ff6b6b;
      --mana: #5eb6ff;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #101417 0%, #151b1f 100%);
      color: var(--text);
    }

    body { padding: 20px; }

    .app {
      width: min(100%, 1100px);
      margin: 0 auto;
    }

    .hero, .panel, .character-card {
      background: rgba(24, 32, 36, 0.94);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 22px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle, .small, .status {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .join-code {
      min-width: 150px;
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.05);
      text-align: center;
    }

    .join-code strong {
      display: block;
      margin-top: 4px;
      font-size: 1.8rem;
      letter-spacing: 0.08em;
    }

    .panel {
      padding: 16px;
      margin-bottom: 16px;
    }

    .landing {
      display: grid;
      min-height: calc(100vh - 40px);
      place-items: center;
    }

    .choice-panel {
      width: min(100%, 760px);
      padding: 24px;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .choice-card {
      min-height: 170px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      padding: 18px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

    .choice-card:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .choice-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.35rem;
    }

    .choice-card span {
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.45;
    }

    .mode-tabs {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius);
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0d1710;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .player-form {
      grid-template-columns: minmax(120px, 160px) 1fr auto;
    }

    .joined-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(80, 200, 120, 0.32);
      border-radius: var(--radius);
      background: rgba(80, 200, 120, 0.08);
    }

    #codeInput {
      text-transform: uppercase;
    }

    .input {
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(80, 200, 120, 0.18);
    }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: #0d1710; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .btn-danger { background: rgba(255, 107, 107, 0.16); color: #ffd7d7; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }

    .toolbar .right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .character-card { padding: 16px; }

    .character-card.mine {
      border-color: rgba(80, 200, 120, 0.58);
      box-shadow: 0 0 0 2px rgba(80, 200, 120, 0.12), var(--shadow);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 14px;
    }

    .character-name {
      margin: 0;
      font-size: 1.2rem;
      word-break: break-word;
    }

    .stats {
      display: grid;
      gap: 12px;
    }

    .stat-block {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: var(--radius);
      padding: 13px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .label { font-weight: 800; }
    .label.health { color: #ff9a9a; }
    .label.mana { color: #9bd1ff; }
    .value { font-size: 1.25rem; font-weight: 900; }

    .bar {
      height: 11px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .fill.health { background: linear-gradient(90deg, #ff5757, #ff9a7b); }
    .fill.mana { background: linear-gradient(90deg, #3aa2ff, #78d0ff); }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .controls button {
      border: none;
      border-radius: var(--radius);
      min-height: 38px;
      padding: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      cursor: pointer;
    }

    .controls button:hover { background: rgba(255, 255, 255, 0.13); }
    .hidden, .host-only.hidden, .player-only.hidden { display: none; }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 16px;
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .hero { grid-template-columns: 1fr; }
      .choice-grid { grid-template-columns: 1fr; }
      .form-row, .player-form { grid-template-columns: 1fr; }
      .controls { grid-template-columns: repeat(2, 1fr); }
      .toolbar { align-items: stretch; }
      .toolbar .right, .toolbar .right .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="landing" id="landingScreen">
      <div class="panel choice-panel">
        <h1>Party Tracker</h1>
        <p class="subtitle">Choose how you are joining this game session.</p>
        <div class="choice-grid">
          <button class="choice-card" id="chooseHostBtn" type="button">
            <strong>Host</strong>
            <span>Show the shared party board and display the play code for everyone else.</span>
          </button>
          <button class="choice-card" id="choosePlayerBtn" type="button">
            <strong>Player</strong>
            <span>Enter the play code, join as your character, and manage your own stats.</span>
          </button>
        </div>
      </div>
    </section>

    <section class="hidden" id="sessionScreen">
      <section class="hero">
        <div>
          <h1>Party Tracker</h1>
          <p class="subtitle" id="connectionHelp">Host this page on the big screen. Players enter the play code from their devices.</p>
        </div>
        <div class="join-code host-only">
          <span class="small">Play code</span>
          <strong id="sessionCode">------</strong>
        </div>
      </section>

      <section class="panel">
        <div class="mode-tabs">
          <button class="btn btn-secondary" id="backBtn" type="button">Back</button>
          <span class="status" id="modeLabel">Host Board</span>
        </div>

        <form class="form-row host-only" id="addForm">
          <input id="nameInput" class="input" type="text" maxlength="40" placeholder="Add character name" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Add Character</button>
        </form>

        <form class="form-row player-form player-only hidden" id="joinForm">
          <input id="codeInput" class="input" type="text" maxlength="6" placeholder="Play code" autocomplete="off" />
          <input id="joinNameInput" class="input" type="text" maxlength="40" placeholder="Your character name" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Join Game</button>
        </form>

        <div class="joined-panel player-only hidden" id="joinedPanel">
          <div>
            <strong id="joinedName">Joined</strong>
            <div class="small">Use your character card below to update health and mana.</div>
          </div>
          <button class="btn btn-danger" id="leaveGameBtn" type="button">Exit Game</button>
        </div>
      </section>

      <section class="toolbar">
        <div>
          <div id="summary">0 characters</div>
          <div class="status" id="status">Connecting...</div>
        </div>
        <div class="right host-only">
          <button class="btn btn-secondary" id="resetAllBtn" type="button">Reset All to 10</button>
          <button class="btn btn-danger" id="clearAllBtn" type="button">Clear Session</button>
        </div>
      </section>

      <section id="characterList" class="grid"></section>
    </section>
  </main>

  <script>
    const DEFAULT_POINTS = 10;
    const PLAYER_ID_KEY = 'party-tracker-player-id';
    const PLAYER_CODE_KEY = 'party-tracker-player-code';

    const landingScreen = document.getElementById('landingScreen');
    const sessionScreen = document.getElementById('sessionScreen');
    const chooseHostBtn = document.getElementById('chooseHostBtn');
    const choosePlayerBtn = document.getElementById('choosePlayerBtn');
    const backBtn = document.getElementById('backBtn');
    const modeLabel = document.getElementById('modeLabel');
    const addForm = document.getElementById('addForm');
    const joinForm = document.getElementById('joinForm');
    const joinedPanel = document.getElementById('joinedPanel');
    const joinedName = document.getElementById('joinedName');
    const leaveGameBtn = document.getElementById('leaveGameBtn');
    const nameInput = document.getElementById('nameInput');
    const codeInput = document.getElementById('codeInput');
    const joinNameInput = document.getElementById('joinNameInput');
    const characterList = document.getElementById('characterList');
    const summary = document.getElementById('summary');
    const status = document.getElementById('status');
    const sessionCode = document.getElementById('sessionCode');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    let socket;
    let reconnectTimer;
    const requestedMode = new URLSearchParams(window.location.search).get('mode');
    let mode = requestedMode === 'host' || requestedMode === 'player' ? requestedMode : '';
    let myCharacterId = localStorage.getItem(PLAYER_ID_KEY) || '';
    let playerSessionCode = localStorage.getItem(PLAYER_CODE_KEY) || '';
    let game = { code: '', characters: [] };

    if (mode) setMode(mode);
    connect();

    addForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;
      send('add-character', { name });
      nameInput.value = '';
      nameInput.focus();
    });

    joinForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const code = codeInput.value.trim().toUpperCase();
      const name = joinNameInput.value.trim();
      if (!code || !name) return;
      send('join', { code, name });
    });

    chooseHostBtn.addEventListener('click', () => setMode('host'));
    choosePlayerBtn.addEventListener('click', () => setMode('player'));
    leaveGameBtn.addEventListener('click', () => {
      if (!myCharacterId) return;
      send('delete-character', { characterId: myCharacterId });
        myCharacterId = '';
        playerSessionCode = '';
        localStorage.removeItem(PLAYER_ID_KEY);
        localStorage.removeItem(PLAYER_CODE_KEY);
        status.textContent = 'You left the game.';
        updatePlayerJoinState();
        render();
    });

    backBtn.addEventListener('click', () => {
      mode = '';
      landingScreen.classList.remove('hidden');
      sessionScreen.classList.add('hidden');
      const url = new URL(window.location.href);
      url.searchParams.delete('mode');
      window.history.replaceState({}, '', url);
    });

    resetAllBtn.addEventListener('click', () => send('reset-all'));

    clearAllBtn.addEventListener('click', () => {
      if (!game.characters.length) return;
      if (window.confirm('Clear this session for everyone?')) {
        myCharacterId = '';
        playerSessionCode = '';
        localStorage.removeItem(PLAYER_ID_KEY);
        localStorage.removeItem(PLAYER_CODE_KEY);
        send('clear-all');
      }
    });

    characterList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const { id, action, stat, amount } = button.dataset;
      if (mode === 'player' && id !== myCharacterId) return;

      if (action === 'delete') send('delete-character', { characterId: id });
      if (action === 'change') send('change-stat', { characterId: id, stat, amount: Number(amount) });
      if (action === 'reset') send('reset-character', { characterId: id });
    });

    function connect() {
      clearTimeout(reconnectTimer);
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      socket = new WebSocket(`${protocol}://${window.location.host}`);
      status.textContent = 'Connecting...';

      socket.addEventListener('open', () => {
        status.textContent = 'Live session connected';
        if (mode === 'host') {
          send(game.code ? 'host-session' : 'create-session', { code: game.code });
        }
      });

      socket.addEventListener('message', (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'session-created') {
          game = { code: message.data.code, characters: [] };
          status.textContent = 'Host session ready. Share the play code with your players.';
          render();
        }
        if (message.type === 'state') {
          game = message.data;
          render();
        }
        if (message.type === 'joined') {
          myCharacterId = message.data.characterId;
          playerSessionCode = message.data.code;
          localStorage.setItem(PLAYER_ID_KEY, myCharacterId);
          localStorage.setItem(PLAYER_CODE_KEY, playerSessionCode);
          status.textContent = 'Joined. Your controls are active.';
          render();
        }
        if (message.type === 'error') {
          status.textContent = message.data.message;
        }
      });

      socket.addEventListener('close', () => {
        status.textContent = 'Disconnected. Reconnecting...';
        reconnectTimer = setTimeout(connect, 1000);
      });
    }

    function send(type, data = {}) {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        status.textContent = 'Still connecting. Try again in a moment.';
        return;
      }
      socket.send(JSON.stringify({ type, data }));
    }

    function setMode(nextMode) {
      mode = nextMode;
      landingScreen.classList.add('hidden');
      sessionScreen.classList.remove('hidden');
      document.querySelectorAll('.host-only').forEach((element) => element.classList.toggle('hidden', mode !== 'host'));
      modeLabel.textContent = mode === 'host' ? 'Host Board' : 'Player Control';
      const url = new URL(window.location.href);
      url.searchParams.set('mode', mode);
      window.history.replaceState({}, '', url);
      updatePlayerJoinState();
      if (mode === 'player' && !getMyCharacter()) codeInput.focus();
      if (mode === 'host') {
        if (!game.code) send('create-session');
        nameInput.focus();
      }
      render();
    }

    function render() {
      sessionCode.textContent = mode === 'host' ? game.code || '------' : '------';
      if (!mode) return;

      updatePlayerJoinState();
      summary.textContent = `${game.characters.length} character${game.characters.length === 1 ? '' : 's'}`;

      if (!game.characters.length) {
        characterList.innerHTML = '<div class="empty">No characters yet. Add one from the host board or join as a player.</div>';
        return;
      }

      characterList.innerHTML = game.characters.map((character) => {
        const isMine = character.id === myCharacterId;
        const canControl = mode === 'host' || isMine;
        const healthPercent = Math.max(0, Math.min(100, (character.health / DEFAULT_POINTS) * 100));
        const manaPercent = Math.max(0, Math.min(100, (character.mana / DEFAULT_POINTS) * 100));

        return `
          <article class="character-card ${isMine ? 'mine' : ''}">
            <div class="card-top">
              <div>
                <h2 class="character-name">${escapeHtml(character.name)}</h2>
                <div class="small">${isMine ? 'Your character' : canControl ? 'Host controls enabled' : 'Viewing only'}</div>
              </div>
              ${mode === 'host' ? `<button class="btn btn-danger" data-action="delete" data-id="${character.id}" type="button">Delete</button>` : ''}
            </div>

            ${renderStat(character, 'health', character.health, healthPercent, canControl)}
            ${renderStat(character, 'mana', character.mana, manaPercent, canControl)}

            ${canControl ? `
              <div style="margin-top:12px;">
                <button class="btn btn-secondary" data-action="reset" data-id="${character.id}" type="button">Reset to 10/10</button>
              </div>
            ` : ''}
          </article>
        `;
      }).join('');
    }

    function renderStat(character, stat, value, percent, canControl) {
      const label = stat === 'health' ? 'Health' : 'Mana';
      return `
        <section class="stat-block">
          <div class="stat-header">
            <span class="label ${stat}">${label}</span>
            <span class="value">${value}</span>
          </div>
          <div class="bar"><div class="fill ${stat}" style="width:${percent}%"></div></div>
          ${canControl ? `
            <div class="controls">
              <button data-action="change" data-stat="${stat}" data-amount="-3" data-id="${character.id}" type="button">-3</button>
              <button data-action="change" data-stat="${stat}" data-amount="-1" data-id="${character.id}" type="button">-1</button>
              <button data-action="change" data-stat="${stat}" data-amount="1" data-id="${character.id}" type="button">+1</button>
              <button data-action="change" data-stat="${stat}" data-amount="3" data-id="${character.id}" type="button">+3</button>
            </div>
          ` : ''}
        </section>
      `;
    }

    function updatePlayerJoinState() {
      const isPlayer = mode === 'player';
      const mine = getMyCharacter();
      document.querySelectorAll('.player-only').forEach((element) => element.classList.toggle('hidden', !isPlayer));
      joinForm.classList.toggle('hidden', !isPlayer || Boolean(mine));
      joinedPanel.classList.toggle('hidden', !isPlayer || !mine);
      if (mine) {
        joinedName.textContent = `Joined as ${mine.name}`;
      }
    }

    function getMyCharacter() {
      return game.characters.find((character) => character.id === myCharacterId);
    }

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
