<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Tracker</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #171b2e;
      --panel-2: #1f2540;
      --text: #edf1ff;
      --muted: #a8b0d3;
      --accent: #7c9cff;
      --health: #ff6b6b;
      --mana: #4dabf7;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top, rgba(124,156,255,0.18), transparent 32%),
        linear-gradient(180deg, #0d1020 0%, #12172a 100%);
      color: var(--text);
      min-height: 100%;
    }

    body {
      padding: 20px;
    }

    .app {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .hero,
    .panel,
    .character-card {
      background: rgba(23, 27, 46, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .panel {
      padding: 18px;
      margin-bottom: 18px;
    }

    .add-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
    }

    .input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,156,255,0.18);
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    .btn-danger {
      background: rgba(255,107,107,0.16);
      color: #ffd7d7;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .toolbar .left {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar .right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .character-card {
      padding: 18px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .character-name {
      margin: 0;
      font-size: 1.2rem;
      word-break: break-word;
    }

    .small {
      color: var(--muted);
      font-size: 0.88rem;
      margin-top: 4px;
    }

    .stats {
      display: grid;
      gap: 14px;
    }

    .stat-block {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 14px;
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 10px;
    }

    .label {
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .label.health { color: #ff9a9a; }
    .label.mana { color: #9bd1ff; }

    .value {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .bar {
      height: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .fill.health { background: linear-gradient(90deg, #ff6b6b, #ff8787); }
    .fill.mana { background: linear-gradient(90deg, #4dabf7, #74c0fc); }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .controls button {
      border: none;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      background: rgba(255,255,255,0.07);
      color: var(--text);
      cursor: pointer;
    }

    .controls button:hover {
      background: rgba(255,255,255,0.12);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 30px 16px;
      border: 1px dashed rgba(255,255,255,0.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.03);
    }

    .footer-note {
      text-align: center;
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.88rem;
    }

    @media (max-width: 640px) {
      body {
        padding: 14px;
      }

      .hero,
      .panel,
      .character-card {
        border-radius: 16px;
      }

      .add-form {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: repeat(2, 1fr);
      }

      .toolbar {
        align-items: stretch;
      }

      .toolbar .right {
        width: 100%;
      }

      .toolbar .right .btn {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Party Tracker</h1>
    </section>

    <section class="panel">
      <form class="add-form" id="addForm">
        <input
          id="nameInput"
          class="input"
          type="text"
          maxlength="40"
          placeholder="Enter character name"
          autocomplete="off"
          required
        />
        <button class="btn btn-primary" type="submit">Add Character</button>
      </form>
    </section>

    <section class="toolbar">
      <div class="left" id="summary">0 characters</div>
      <div class="right">
        <button class="btn btn-secondary" id="resetAllBtn" type="button">Reset All to 10</button>
        <button class="btn btn-danger" id="clearAllBtn" type="button">Clear All</button>
      </div>
    </section>

    <section id="characterList" class="grid"></section>
  </main>

  <script>
    const STORAGE_KEY = 'party-tracker-characters';
    const DEFAULT_POINTS = 10;

    const addForm = document.getElementById('addForm');
    const nameInput = document.getElementById('nameInput');
    const characterList = document.getElementById('characterList');
    const summary = document.getElementById('summary');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    let characters = loadCharacters();
    render();

    addForm.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      characters.unshift({
        id: crypto.randomUUID(),
        name,
        health: DEFAULT_POINTS,
        mana: DEFAULT_POINTS,
      });

      nameInput.value = '';
      saveCharacters();
      render();
      nameInput.focus();
    });

    resetAllBtn.addEventListener('click', () => {
      characters = characters.map((character) => ({
        ...character,
        health: DEFAULT_POINTS,
        mana: DEFAULT_POINTS,
      }));
      saveCharacters();
      render();
    });

    clearAllBtn.addEventListener('click', () => {
      if (!characters.length) return;
      const confirmed = window.confirm('Remove all characters?');
      if (!confirmed) return;
      characters = [];
      saveCharacters();
      render();
    });

    characterList.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-action]');
      if (!button) return;

      const { id, action, stat, amount } = button.dataset;
      const index = characters.findIndex((character) => character.id === id);
      if (index === -1) return;

      if (action === 'delete') {
        characters.splice(index, 1);
      } else if (action === 'change') {
        const value = Number(amount);
        characters[index][stat] = Math.max(0, characters[index][stat] + value);
      } else if (action === 'reset') {
        characters[index].health = DEFAULT_POINTS;
        characters[index].mana = DEFAULT_POINTS;
      }

      saveCharacters();
      render();
    });

    function loadCharacters() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveCharacters() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(characters));
    }

    function render() {
      summary.textContent = `${characters.length} character${characters.length === 1 ? '' : 's'}`;

      if (!characters.length) {
        characterList.innerHTML = `
          <div class="empty">
            No characters yet. Add one above to start tracking the game.
          </div>
        `;
        return;
      }

      characterList.innerHTML = characters.map((character) => {
        const healthPercent = Math.max(0, Math.min(100, (character.health / DEFAULT_POINTS) * 100));
        const manaPercent = Math.max(0, Math.min(100, (character.mana / DEFAULT_POINTS) * 100));

        return `
          <article class="character-card">
            <div class="card-top">
              <div>
                <h2 class="character-name">${escapeHtml(character.name)}</h2>
              </div>
              <button class="btn btn-danger" data-action="delete" data-id="${character.id}" type="button">Delete</button>
            </div>

            <div class="stats">
              <section class="stat-block">
                <div class="stat-header">
                  <span class="label health">Health</span>
                  <span class="value">${character.health}</span>
                </div>
                <div class="bar"><div class="fill health" style="width:${healthPercent}%"></div></div>
                <div class="controls">
                  <button data-action="change" data-stat="health" data-amount="-3" data-id="${character.id}" type="button">-3</button>
                  <button data-action="change" data-stat="health" data-amount="-1" data-id="${character.id}" type="button">-1</button>
                  <button data-action="change" data-stat="health" data-amount="1" data-id="${character.id}" type="button">+1</button>
                  <button data-action="change" data-stat="health" data-amount="3" data-id="${character.id}" type="button">+3</button>
                </div>
              </section>

              <section class="stat-block">
                <div class="stat-header">
                  <span class="label mana">Mana</span>
                  <span class="value">${character.mana}</span>
                </div>
                <div class="bar"><div class="fill mana" style="width:${manaPercent}%"></div></div>
                <div class="controls">
                  <button data-action="change" data-stat="mana" data-amount="-3" data-id="${character.id}" type="button">-3</button>
                  <button data-action="change" data-stat="mana" data-amount="-1" data-id="${character.id}" type="button">-1</button>
                  <button data-action="change" data-stat="mana" data-amount="1" data-id="${character.id}" type="button">+1</button>
                  <button data-action="change" data-stat="mana" data-amount="3" data-id="${character.id}" type="button">+3</button>
                </div>
              </section>
            </div>

            <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-secondary" data-action="reset" data-id="${character.id}" type="button">Reset to 10/10</button>
            </div>
          </article>
        `;
      }).join('');
    }

    function escapeHtml(value) {
      return value
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
